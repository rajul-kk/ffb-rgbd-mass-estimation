name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install numpy==2.2.6 opencv-python-headless==4.13.0.90 pandas==2.3.3 pytest==9.0.2 scipy==1.15.3
      - run: pytest -q
